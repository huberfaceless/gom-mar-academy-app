name: Projektpruefung

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: TypeScript und Produktions-Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Bun einrichten
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Abhaengigkeiten installieren
        run: bun install --frozen-lockfile

      - name: TypeScript pruefen
        run: bun run lint

      - name: Academy-Lokalisierung pruefen
        run: bun run audit:academy

      - name: Firebase-Tarifverwaltung pruefen
        run: bun run audit:membership-admin

      - name: Cloud-Run-Deployment pruefen
        run: bun run audit:deployment

      - name: Produktions-Build erstellen
        run: bun run build

  deploy:
    name: Nach Cloud Run bereitstellen
    needs: quality
    if: >-
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')) &&
      vars.GCP_PROJECT_ID != '' &&
      vars.GCP_REGION != '' &&
      vars.CLOUD_RUN_SERVICE != '' &&
      vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' &&
      vars.GCP_SERVICE_ACCOUNT != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Kurzlebig bei Google Cloud anmelden
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Geprueften Stand nach Cloud Run deployen
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          region: ${{ vars.GCP_REGION }}
          service: ${{ vars.CLOUD_RUN_SERVICE }}
          source: .
          env_vars: APP_COMMIT_SHA=${{ github.sha }}
          env_vars_update_strategy: merge

      - name: Ausgelieferte Revision verifizieren
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
          SERVICE_URL: ${{ steps.deploy.outputs.url }}
        run: |
          for attempt in 1 2 3 4 5; do
            HEALTH_RESPONSE="$(curl --fail --silent --show-error "${SERVICE_URL}/api/health")" || true
            if HEALTH_RESPONSE="${HEALTH_RESPONSE}" EXPECTED_COMMIT="${EXPECTED_COMMIT}" node -e '
              const health = JSON.parse(process.env.HEALTH_RESPONSE || "{}");
              process.exit(health.status === "ok" && health.commit === process.env.EXPECTED_COMMIT ? 0 : 1);
            '; then
              exit 0
            fi
            sleep 10
          done
          echo "Die neue Cloud-Run-Revision wurde nicht eindeutig ausgeliefert."
          exit 1
